{% extends "base.html" %}

{% block title %}Сообщение{% endblock %}

{% block content %}
  <h1>{% if form.instance.pk %}Изменение{% else %}Создание{% endif %} сообщения</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success" type="submit">Сохранить</button>
    <a class="btn btn-link" href="{% url 'mailings:message_list' %}">Отмена</a>
  </form>
{% endblock %}
