{% extends "base.html" %}

{% block title %}Сообщения{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Сообщения</h1>
    <a class="btn btn-primary" href="{% url 'mailings:message_create' %}">Создать</a>
  </div>
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Тема</th>
        <th>Текст</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for message in messages %}
        <tr>
          <td>{{ message.subject }}</td>
          <td>{{ message.body|truncatechars:80 }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-secondary" href="{% url 'mailings:message_update' message.pk %}">Изменить</a>
            <a class="btn btn-sm btn-danger" href="{% url 'mailings:message_delete' message.pk %}">Удалить</a>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="3">Сообщения не найдены.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
