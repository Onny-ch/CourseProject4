{% extends "base.html" %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
  <h1>Удалить объект?</h1>
  <p>Вы уверены, что хотите удалить «{{ object }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{{ request.META.HTTP_REFERER|default:"/" }}">Отмена</a>
  </form>
{% endblock %}
