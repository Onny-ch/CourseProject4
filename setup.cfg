[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    build,
    dist

[isort]
profile = black
line_length = 120
known_first_party = users,mailings,config
multi_line_output = 3
include_trailing_comma = true

[black]
line-length = 120
target-version = py313
exclude = 
    /(\.git|\.venv|venv|build|dist|migrations)/

